name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gitleaks 8.30.1 and shellcheck
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Repo checks (forbidden files, secrets, shell, python, tests)
        run: tools/check-repo.sh

      - name: Secrets across full history
        run: gitleaks detect --no-banner --redact --log-opts="--all"
